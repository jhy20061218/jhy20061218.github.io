<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://guestbook.jhy20061218.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>留言管理 · 贾涵翌</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <script src="../js/theme-init.js"></script>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="grain" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  </svg>

  <main class="container post gb">
    <div class="cluster post__bar">
      <a class="link-back glass" href="./"><svg class="icon icon--sm"><use href="#i-arrow-left"/></svg>回到留言箱</a>
      <button class="btn btn--icon btn--glass btn--sm theme-toggle" id="themeBtn" type="button" aria-label="切换深浅色">
        <svg class="icon icon--sm icon-sun"><use href="#i-sun"/></svg>
        <svg class="icon icon--sm icon-moon"><use href="#i-moon"/></svg>
      </button>
    </div>

    <header class="section-head">
      <p class="eyebrow">Admin</p>
      <h1 class="h2">留言管理</h1>
      <p class="section-head__desc">审核、回复或删除留言。密码只保存在这个标签页里，关掉就清除。</p>
    </header>

    <form class="gb-admin-login glass" id="admLogin" data-api="https://guestbook.jhy20061218.workers.dev" novalidate>
      <label class="field">
        <span class="field__label">管理密码</span>
        <input class="field__input" name="token" type="password" autocomplete="current-password" required />
      </label>
      <button class="btn btn--primary" type="submit">进入</button>
      <button class="btn btn--glass" type="button" id="admLogout" hidden>退出</button>
    </form>
    <p class="gb-status" id="admStatus" role="status" aria-live="polite"></p>

    <div id="admPanel" hidden>
      <div class="cluster gb-tabs" role="group" aria-label="留言状态">
        <button class="btn btn--glass btn--sm" type="button" data-status="pending" aria-pressed="true">待审核</button>
        <button class="btn btn--glass btn--sm" type="button" data-status="approved" aria-pressed="false">已公开</button>
      </div>
      <ul class="gb-list" id="admList" style="margin-top: var(--space-5)"></ul>
      <p class="gb-empty glass" id="admEmpty" hidden>这里没有留言。</p>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/guestbook-admin.js"></script>
</body>
</html>
