<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面不存在 · 贾涵翌</title>
  <meta name="robots" content="noindex" />
  <!-- 404 页可能出现在任意路径下，所以资源都用 / 开头的绝对路径 -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <script>document.documentElement.classList.remove('no-js');try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    .notfound { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding-block: var(--space-12); }
    .notfound__code { font-size: clamp(96px, 22vw, 180px); line-height: 1; font-weight: 800; letter-spacing: -.05em; }
    .notfound .lead { margin-top: var(--space-4); }
    .notfound .cluster { justify-content: center; margin-top: var(--space-8); }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="container notfound">
    <div>
      <p class="eyebrow" data-reveal>Not Found</p>
      <h1 class="notfound__code text-gradient" data-reveal>404</h1>
      <p class="lead" data-reveal>这个页面不存在，可能链接写错了，或者它已经被移走了。</p>
      <div class="cluster" data-reveal>
        <a class="btn btn--primary btn--lg" href="/">回到首页</a>
        <a class="btn btn--glass btn--lg" href="/#notes">看看随笔</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var items = document.querySelectorAll('[data-reveal]');
      items.forEach(function (el, i) { el.style.setProperty('--i', i); });
      requestAnimationFrame(function () { requestAnimationFrame(function () {
        items.forEach(function (el) { el.classList.add('is-in'); });
      }); });
    })();
  </script>
</body>
</html>
